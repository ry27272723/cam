<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Visual Effects</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Mode Selection Screen -->
    <div id="selectionScreen" class="selection-screen">
        <div class="selection-content">
            <h1>✨ Hand Gesture Visual Effects</h1>
            <p class="subtitle">Choose your magical theme</p>

            <div class="mode-cards">
                <button class="mode-card" data-mode="nightsky">
                    <div class="mode-card-icon">🌙</div>
                    <h2>Night Sky</h2>
                    <p>Shooting stars, fireworks, and glowing halos</p>
                    <div class="gesture-preview">
                        <span>☝️ Shooting Star</span>
                        <span>✊ Firework</span>
                        <span>✋ Halo</span>
                    </div>
                </button>

                <button class="mode-card" data-mode="garden">
                    <div class="mode-card-icon">🌸</div>
                    <h2>Garden</h2>
                    <p>Blooming flowers, rain, and nature's beauty</p>
                    <div class="gesture-preview">
                        <span>✊ Rain</span>
                        <span>✋ Growing Flowers</span>
                        <span>☝️ Bloom</span>
                    </div>
                </button>

                <button class="mode-card" data-mode="magic">
                    <div class="mode-card-icon">✨</div>
                    <h2>Magic</h2>
                    <p>Mystical circles, spark orbs, and spells</p>
                    <div class="gesture-preview">
                        <span>☝️ Spark Orb</span>
                        <span>✋ Magic Circle</span>
                        <span>✊ Clear</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Camera Screen -->
    <div id="cameraScreen" class="camera-screen hidden">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="effectsCanvas"></canvas>

        <!-- Status Overlay -->
        <div class="status-overlay">
            <button id="backBtn" class="back-btn">← Back</button>
            <div class="status-info">
                <div id="modeStatus" class="mode-status">Night Sky Mode</div>
                <div id="gestureStatus" class="gesture-status">No gesture detected</div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading camera and hand detection...</p>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Application Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
